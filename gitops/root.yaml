# app-of-apps: Application을 만드는 Application.
# gitops/applications/ 안의 Application 매니페스트를 Argo CD가 읽어 클러스터에 만든다.
# 이 파일만 사람이 `kubectl apply`하고(부트스트랩), 이후 Application 추가·수정은 Git PR로 한다.
#
# 이 파일은 gitops/applications/ 밖에 둔다. 안에 두면 root가 자기 자신을 관리하게 된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/knockinthecave/k8s-ops-lab.git
    targetRevision: main
    path: gitops/applications
  destination:
    server: https://kubernetes.default.svc
    # 만들어지는 대상은 Application 리소스이고, 이것들은 argocd 네임스페이스에 놓인다
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      # Git에서 Application 파일을 지우면 클러스터의 Application도 지운다.
      # 주의: Application에 finalizer가 없어서 Application만 사라지고 배포된 리소스는 남는다.
      prune: true
