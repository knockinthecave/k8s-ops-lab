# API 그룹/버전: Deployment는 apps/v1 그룹에 속함
apiVersion: apps/v1
# 리소스 종류: 파드의 선언적 배포·롤링 업데이트·복구를 관리
kind: Deployment
metadata:
  # Deployment 이름 (네임스페이스 내에서 고유)
  name: podinfo
  # Deployment 자체에 붙는 라벨 (조회/분류용)
  labels:
    app: podinfo
spec:
  # 유지할 파드 복제본 수 (3개가 항상 실행되도록 보장)
  replicas: 3
  # 롤링 업데이트 전략: 새 버전 배포 시 파드를 점진적으로 교체
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 업데이트 중 replicas보다 추가로 만들 수 있는 파드 수
      maxSurge: 1
      # 업데이트 중 사용 불가 상태를 허용할 파드 수 (0 = 항상 3개 유지, 무중단)
      maxUnavailable: 0
  # 새 파드가 Ready 된 뒤 이 시간(초) 동안 안정적이어야 배포 성공으로 간주
  minReadySeconds: 5
  # 롤백용으로 보관할 이전 ReplicaSet 개수
  revisionHistoryLimit: 5
  # 이 Deployment가 관리할 파드를 고르는 조건
  selector:
    matchLabels:
      # template.metadata.labels와 반드시 일치해야 함
      app: podinfo
  # 생성할 파드의 템플릿
  template:
    metadata:
      labels:
        # Service selector가 이 라벨로 파드를 찾음
        app: podinfo
    spec:
      containers:
        # 컨테이너 이름
        - name: podinfo
          # 컨테이너 이미지 (태그 고정으로 재현 가능한 배포)
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            # 포트에 이름을 부여 -> Service의 targetPort에서 "http"로 참조
            - name: http
              # 컨테이너가 listen하는 포트
              containerPort: 9898
          # 리소스 요청/제한
          resources:
            # requests: 스케줄러가 노드 배치 시 보장하는 최소 자원
            requests:
              cpu: 50m
              memory: 64Mi
            # limits: 초과 시 CPU는 throttling, 메모리는 OOMKilled
            limits:
              cpu: 200m
              memory: 128Mi
          # startupProbe: 기동 완료 확인. 성공 전까지 liveness/readiness 유예
          # (최대 failureThreshold x periodSeconds = 30초)
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          # livenessProbe: 실패하면 컨테이너를 재시작 (죽은 앱 복구)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readinessProbe: 실패하면 Service 엔드포인트에서 제외 (트래픽 차단, 재시작 X)
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
