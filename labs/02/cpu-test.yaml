# 실습 3: CPU를 100% 쓰려는 프로세스에 limit 100m을 걸어 throttling을 관찰한다.
# 메모리와 달리 죽지 않고 느려지기만 한다.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-test
  labels:
    app: cpu-test
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--cpu", "1"]
      resources:
        requests:
          cpu: 50m
        limits:
          cpu: 100m
