# 실습 2: 실행 중 메모리가 limit을 넘어 OOMKilled 되는 상황을 만든다.
# limit 100Mi인데 150M을 할당하므로 컨테이너가 반복해서 죽는다.
apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  labels:
    app: oom-test
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
      resources:
        requests:
          memory: 50Mi
        limits:
          memory: 100Mi
