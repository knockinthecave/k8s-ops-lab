# PR과 main 푸시에서 매니페스트를 검증한다. 실제 검사는 scripts/ci-check.sh에 있다(로컬에서도 같은 명령 실행 가능).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      TRIVY_VERSION: 0.76.2
      YAMLLINT_VERSION: 1.38.0
    steps:
      - uses: actions/checkout@v4

      - name: 도구 설치 (버전 고정)
        run: |
          pip install "yamllint==${YAMLLINT_VERSION}"
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" kubeconform
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/bin" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 매니페스트 검증과 스캔
        run: scripts/ci-check.sh
